{{- /* Wrap tables so only the table scrolls horizontally on small screens. */ -}}
<div class="table-wrap" role="region" aria-label="表格（可横向滚动）" tabindex="0">
<table
  {{- range $k, $v := .Attributes }}
    {{- if $v }}
      {{- printf " %s=%q" $k $v | safeHTMLAttr }}
    {{- end }}
  {{- end }}>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{- .Text -}}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{- .Text -}}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
{{- /**/ -}}
